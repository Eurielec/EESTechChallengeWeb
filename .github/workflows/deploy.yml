name: CI/CD Pipeline

on:
  push:
    branches:
      - main    # Despliegue cuando se haga push en main
      - develop  # Solo pruebas cuando se haga push en develop

jobs:
  # Trabajo para la rama develop (solo pruebas)
  test:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'  # Solo se ejecuta en la rama develop

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up Docker
        uses: docker/setup-qemu-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
          npm install

      - name: Build Docker image
        run: |
          docker build -t ec-landing-page .

      - name: Test Docker Compose up (without deploying)
        run: |
          docker compose -f docker-compose.yml up -d  # Levanta los contenedores
          docker ps -a  # Verifica que los contenedores se estén ejecutando correctamente

      - name: Check if the app is running
        run: |
          curl --fail http://localhost:3001 || exit 1  # Verifica que la app esté respondiendo

  # Trabajo para la rama main (despliegue)
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # Solo se ejecuta en la rama main

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Set up Docker
        uses: docker/setup-qemu-action@v2

      - name: Build Docker image
        run: |
          docker build -t ec-landing-page .

      - name: Deploy to remote server using SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}  # Si usas una passphrase
          port: 22  # El puerto por defecto de SSH es el 22
          script: |
            # Detener contenedores actuales
            docker compose -f /opt/docker/EESTechChallengeWeb/docker-compose.yml down
            # Levantar los nuevos contenedores
            docker compose -f /opt/docker/EESTechChallengeWeb/docker-compose.yml up -d
            # Verificar que la aplicación esté corriendo
            docker ps -a
            # Opcionalmente, verificar con curl que la aplicación esté respondiendo
            curl --fail http://localhost:3001 || exit 1

